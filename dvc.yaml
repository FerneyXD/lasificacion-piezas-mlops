stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw
    params:
      - data
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/common.py
      - src/model_utils.py
      - data/processed/train
      - data/processed/val
    params:
      - data.processed_dir
      - data.seed
      - train
    outs:
      - models/model.keras
      - models/saved_model
      - models/classes.json
      - models/train_info.json
    metrics:
      - reports/train_metrics.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/common.py
      - src/model_utils.py
      - models/model.keras
      - models/classes.json
      - models/train_info.json
      - data/processed/test
    params:
      - data.processed_dir
      - train.img_size
      - train.batch_size
      - evaluate
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/threshold_curve.csv:
          cache: false
          x: threshold
          y: accuracy_accepted
      - reports/confusion_matrix.png:
          cache: false

  monitor:
    cmd: python src/monitor.py
    deps:
      - src/monitor.py
      - src/common.py
      - src/image_features.py
      - src/model_utils.py
      - models/model.keras
      - models/classes.json
      - data/processed/train
      - data/processed/test
    params:
      - data.processed_dir
      - data.seed
      - train.img_size
      - evaluate.threshold
      - monitor
    metrics:
      - reports/drift.json:
          cache: false
    outs:
      - reports/drift_report.html:
          cache: false
