data:
  raw_dir: data/raw
  processed_dir: data/processed
  val_size: 0.15
  test_size: 0.15
  seed: 42
train:
  experiment_name: industrial-vgg16
  img_size: 224
  batch_size: 32
  epochs_head: 3
  epochs_finetune: 2
  lr_head: 0.001
  lr_finetune: 3e-05
  unfreeze_last_n: 4
  dense_units: 256
  dropout: 0.35
evaluate:
  threshold: 0.9
monitor:
  experiment_name: industrial-monitoring
  sample_size: 300
  simulate_drift: false
  with_model: true
